agent:
  id: "testaget2"
  team: "platform-eng"
  runtime: aks
  interaction_model: "standalone"
  guardrail_profile: "moderate"

identity:
  sp_client_id: "3b95d752-26a9-4e80-8eb9-ad65219616b1"
  keyvault_url: "https://kv-agenticdemo-poc.vault.azure.net/"

tools: []
  - id: testtool2
    roles:
      - testtool2.write
      - testtool2.read
    apim_base_url: https://apim-agenticdemo-poc.azure-api.net/tools/testtool2

evaluation:
  suite: default-strict
  ci_gate: true
  pass_threshold: 0.95
  datasets:
    - id: golden-dataset
      version: v1.0
      source: repo
      path: evals/datasets/golden-dataset.json

output_policy:
  violation_threshold: 5
  window_minutes: 1
  action: block
  notify_webhook: 

prompts:
  active_version: v1.0
  source: prompts/system.txt
